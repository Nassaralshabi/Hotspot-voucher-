name: hotspot_voucher
description: A Flutter app for hotspot voucher management

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  flutter_local_notifications: ^16.3.3
  font_awesome_flutter: ^10.6.0
  url_launcher: ^6.2.2
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf
    - family: FontAwesomeBrands
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-brands-400.ttf
    - family: FontAwesomeRegular
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-regular-400.ttf
    - family: FontAwesomeSolid
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-solid-900.ttf