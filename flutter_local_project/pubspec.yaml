name: hotspot_voucher_local
description: A local Flutter app for hotspot voucher management without Firebase

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  flutter_local_notifications: ^16.3.3
  font_awesome_flutter: ^10.6.0
  url_launcher: ^6.2.2
  printing: ^5.12.0
  pdf: ^3.10.4
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf
    - family: FontAwesomeBrands
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-brands-400.ttf
    - family: FontAwesomeRegular
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-regular-400.ttf
    - family: FontAwesomeSolid
      fonts:
        - asset: packages/font_awesome_flutter/lib/fonts/fa-solid-900.ttf